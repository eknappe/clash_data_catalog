  - id: DS007
    name: "Repeat UAV Lidar Surveys Following the 2025 Eaton Fire"
    description: >
      The data consist of repeated UAV lidar surveys collected after the Eaton Fire across 14 debris
      basins and five Bailey catchments between January and March 2025. The surveys produced high-density
      point clouds, orthomosaics, digital elevation models, and measurements of topographic and sediment-
      volume change before and after rainfall events. Supporting data include airborne lidar, rainfall
      records, fixed-camera photographs, debris-basin capacities and excavation records, and USGS debris-
      flow volume predictions.
    pi: "Michael Lamb"
    institution: "Caltech"
    primary_contact: "zchen256@asu.edu"
    observatories:
      - "SoCal"
    data_type:
      - "Elevation"
      - "Imagery"
    instrument: "UAV lidar"
    field_site: "San Gabriel Mountains, CA"
    spatial:
      type: bboxes
      boxes:
        - {north: 34.1946042548837, south: 34.1694257392379, east: -118.04710765304, west: -118.072347365492}
    collection_start: "2025-02-10"
    size_gb: 100.0
    data_level: "L1: Calibrated data"
    data_location: "available upon request"
    date_added: "2026-08-31"

