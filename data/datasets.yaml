  - id: DS005
    name: "Palisades fire ERT, water isotopes data, and saturated infiltration data"
    description: >
      Electrical resistivity tomography (ERT): Six to seven repeat surveys documenting changes in
      subsurface moisture across the Mandeville burned, Mandeville unburned, Rustic Canyon, Santa Ynez,
      Parker Mesa, and Topanga West catchments, conducted from March 2025 through February 2026.  Water-
      isotope analyses: Measurements documenting temporal changes in the contribution of subsurface
      moisture to streamflow in the Mandeville burned, Mandeville unburned, and Topanga West catchments,
      conducted from January 2025 through February 2026.  Saturated hydraulic conductivity: Measurements
      collected in the Mandeville burned, Mandeville unburned, Rustic Canyon, Santa Ynez, and Topanga West
      catchments.
    pi: "Josh West"
    institution: "University of Southern California"
    personnel:
      - "Sally Keating"
      - "Marin Clark"
      - "Benjamin Tan"
      - "Seulgi Moon"
      - "Rain Blankenship"
      - "Yang Ma"
    observatories:
      - "SoCal"
    data_type:
      - "Field observations"
      - "Geochemical"
      - "Geophysical"
      - "Hydrological"
      - "Sedimentological / Soil"
    instrument: "Syscal Pro electrical resistivity tomography"
    field_site: "Santa Monica Mountains"
    spatial:
      type: bboxes
      boxes:
        - {north: 34.120738, south: 34.05195589775913, east: -118.503026, west: -118.5873890657853}
    collection_start: "2025-01-28"
    collection_end: "2026-05-31"
    temporal_resolution: "Seven ERT campaigns, over 20 water isotope campaigns"
    spatial_resolution: "6 catchements"
    format: "RESIPY, xlsx"
    size_gb: 1.0
    data_level: "L3: Aggregated data"
    collection_status: Complete - collection finished
    data_location: "Local drive. I can upload finalized versions to clash drive."
    date_added: "2026-08-28"

