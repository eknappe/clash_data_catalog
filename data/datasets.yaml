  - id: DS011
    name: "Precipitation Data for Postfire Debris-Flows in southern California, 2021-2025"
    description: >
      This collection contains 12 gridded precipitation datasets and gauge (point) data over southern
      California during seven debris-flow triggering storms between 2021 and 2025. The precipitation
      estimates were gathered from already published, open-access data sources to support work
      investigating the utility of gridded precipitation data for postfire debris-flow applications. The
      project also includes a list of documented postfire debris flows during the storms investigated.
    pi: "Daniel Horton"
    institution: "Northwestern University"
    primary_contact: "Ann Sinclair - annsinclair2028@u.northwestern.edu"
    personnel:
      - "Ann Sinclair"
      - "Nina Oakley"
      - "Joshua West"
      - "Marin Clark"
      - "Daniel Horton"
    observatories:
      - "SoCal"
    data_type:
      - "Meteorological / Climatological"
    instrument: "rain gauges, radar, satellite, numerical weather prediction models, reanalysis"
    parameters_measured:
      - "Precipitation intensity"
    field_site: "southern California"
    spatial:
      type: bboxes
      boxes:
        - {north: 38.0, south: 32.0, east: -114.0, west: -123.0}
    collection_start: "2021-01-27"
    collection_end: "2025-09-17"
    temporal_resolution: "1 hour"
    spatial_resolution: "variable"
    format: "netCDF"
    size_gb: 10.0
    data_level: "L4: Derived products"
    collection_status: Published - data is in a data repository
    data_location: "https://doi.org/10.17603/ds2-bbfe-8v84"
    doi: "https://doi.org/10.17603/ds2-bbfe-8v84"
    date_added: "2026-09-02"

